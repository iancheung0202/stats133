<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Labs — Stats 133</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #f5f4f0; --ink: #1a1a18; --muted: #888880; --accent: #c0392b; --border: #d8d7d2; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: 'IBM Plex Sans', sans-serif; font-weight: 300;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    main { max-width: 480px; width: 100%; }
    header { margin-bottom: 3rem; opacity: 0; animation: up 0.5s ease forwards; }
    header a.back {
      display: inline-block; margin-bottom: 1.2rem;
      font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); text-decoration: none; transition: color 0.15s;
    }
    header a.back:hover { color: var(--accent); }
    header h1 {
      font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem;
      font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted);
    }
    header h1 span { color: var(--accent); }
    nav { border-top: 1px solid var(--border); }
    nav a {
      display: flex; align-items: baseline; gap: 1rem;
      padding: 1.1rem 0; border-bottom: 1px solid var(--border);
      text-decoration: none; color: var(--ink);
      font-family: 'IBM Plex Mono', monospace; font-size: 1rem; font-weight: 400;
      transition: color 0.15s; opacity: 0; animation: up 0.5s ease forwards;
    }
    nav a:nth-child(1) { animation-delay: 0.10s; }
    nav a:nth-child(2) { animation-delay: 0.18s; }
    nav a:nth-child(3) { animation-delay: 0.26s; }
    nav a:nth-child(4) { animation-delay: 0.34s; }
    nav a:nth-child(5) { animation-delay: 0.42s; }
    nav a:nth-child(6) { animation-delay: 0.50s; }
    nav a:nth-child(7) { animation-delay: 0.58s; }
    nav a:nth-child(8) { animation-delay: 0.66s; }
    nav a:nth-child(9) { animation-delay: 0.74s; }
    nav a:nth-child(10) { animation-delay: 0.82s; }
    nav a:nth-child(11) { animation-delay: 0.90s; }
    nav a:nth-child(12) { animation-delay: 0.98s; }
    nav a:nth-child(13) { animation-delay: 1.06s; }
    nav a:hover { color: var(--accent); }
    nav a .label { flex: 1; }
    nav a .path { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.05em; transition: color 0.15s; }
    nav a:hover .path { color: var(--accent); }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
