<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stats 133</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --ink: #1a1a18;
      --muted: #888880;
      --accent: #c0392b;
      --border: #d8d7d2;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    main {
      max-width: 480px;
      width: 100%;
    }

    header {
      margin-bottom: 3rem;
      opacity: 0;
      animation: up 0.5s ease forwards;
    }

    header h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    header h1 span {
      color: var(--accent);
    }

    header h2 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 10px;
      color: var(--muted);
    }

    nav {
      border-top: 1px solid var(--border);
    }

    nav a {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding: 1.1rem 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--ink);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 1rem;
      font-weight: 400;
      transition: color 0.15s;
      opacity: 0;
      animation: up 0.5s ease forwards;
    }

    nav a:nth-child(1) { animation-delay: 0.1s; }
    nav a:nth-child(2) { animation-delay: 0.2s; }
    nav a:nth-child(3) { animation-delay: 0.3s; }

    nav a:hover { color: var(--accent); }

    nav a .label {
      flex: 1;
    }

    nav a .path {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      transition: color 0.15s;
    }

    nav a:hover .path { color: var(--accent); }

    footer {
      margin-top: 2.5rem;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.7;
      opacity: 0;
      animation: up 0.5s ease 0.45s forwards;
    }

    footer a {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    footer a:hover { color: var(--accent); }

    @keyframes up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Stats <span>133</span></h1>
      <h2>Ian Cheung</h2>
    </header>

    <nav>
      <a href="/labs">
        <span class="label">Labs</span>
        <span class="path">/labs</span>
      </a>
      <a href="/projects">
        <span class="label">Projects</span>
        <span class="path">/projects</span>
      </a>
      <a href="/ps">
        <span class="label">Problem Sets</span>
        <span class="path">/ps</span>
      </a>
    </nav>

    <footer>
      This project is hosted on <a href="https://github.com/iancheung0202/stats133" target="_blank" rel="noopener">GitHub</a> and deployed to Netlify automatically. No need to create a new project every time for every single assignment.
    </footer>
  </main>
</body>
</html>
